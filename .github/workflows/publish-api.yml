name: Publish API (+ web app)

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Flutter web build (optional: the iPhone / browser version) ----
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter web
        continue-on-error: true
        working-directory: smart_plug_app
        run: |
          flutter create --project-name smart_plug_app --platforms web .
          sed -i 's#<title>smart_plug_app</title>#<title>Smart Energy</title>#' web/index.html || true
          sed -i 's#apple-mobile-web-app-title" content="smart_plug_app"#apple-mobile-web-app-title" content="Smart Energy"#' web/index.html || true
          flutter pub get
          dart run flutter_launcher_icons -f flutter_launcher_icons-web.yaml || echo "Web icon generation skipped"
          flutter build web --release

      - name: Put web build inside the API (wwwroot)
        continue-on-error: true
        run: |
          mkdir -p SmartEnergyApi-net10/SmartEnergyApi/wwwroot
          cp -r smart_plug_app/build/web/. SmartEnergyApi-net10/SmartEnergyApi/wwwroot/

      # ---- API publish ----
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet publish SmartEnergyApi-net10/SmartEnergyApi/SmartEnergyApi.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: publish

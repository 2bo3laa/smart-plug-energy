name: Publish API

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet publish SmartEnergyApi-net10/SmartEnergyApi/SmartEnergyApi.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: publish

name: Build APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Server address, e.g. https://smart-energy-api.onrender.com (leave empty for default)"
        required: false
        default: ""
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart_plug_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android project
        run: |
          flutter create --project-name smart_plug_app --platforms android .
          python3 patch_android.py

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # A fixed signing key keeps the app's SHA-1 identical in every build. Google Sign-In (account linking)
      # only works if that SHA-1 is registered in Google Cloud, so the key comes from a repository secret.
      - name: Use the fixed signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using the fixed keystore from DEBUG_KEYSTORE_BASE64"
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret: the APK is signed with a temporary key (Google linking will not work)"
          fi

      - name: Build release APK
        env:
          INPUT_API_URL: ${{ github.event.inputs.api_url }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          API_URL=""
          if [ -n "$INPUT_API_URL" ]; then API_URL="${INPUT_API_URL%/}/api"; fi
          flutter build apk --release --dart-define=API_URL=$API_URL --dart-define=GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID

      - uses: actions/upload-artifact@v4
        with:
          name: smart-plug-apk
          path: smart_plug_app/build/app/outputs/flutter-apk/app-release.apk
